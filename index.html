<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <title>Nayasha | Admin Portal</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --ink: #1c1810;
            --cream: #fdfaf4;
            --primary: #c4a962;
            --g4: #c4a962;
            --bd: #e8e2d8;
            --muted: #8a817c;
            --white: #ffffff;
            --ok: #27ae60;
            --err: #e74c3c;
            --sh: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            color: var(--ink);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .admin-container {
            background: var(--white);
            width: 100%;
            max-width: 800px;
            padding: 48px;
            border-radius: 4px;
            box-shadow: var(--sh);
        }

        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 400;
            margin: 0 0 8px;
            letter-spacing: -0.5px;
        }

        .sub-head {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .frow {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        @media (max-width: 600px) {
            .frow {
                grid-template-columns: 1fr;
            }
        }

        .fg {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }

        label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--ink);
        }

        input,
        select,
        textarea {
            padding: 12px 16px;
            border: 1px solid var(--bd);
            border-radius: 2px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color .2s;
            background: #fafafa;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary);
            background: #fff;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-top: 8px;
        }

        .upload-box {
            position: relative;
            aspect-ratio: 3/4;
            border: 2px dashed var(--bd);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            transition: all .2s;
        }

        .upload-box:hover {
            border-color: var(--primary);
            background: #fffdf9;
        }

        .upload-box input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
        }

        .upload-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .upload-box .icon {
            font-size: 24px;
            opacity: 0.3;
            pointer-events: none;
        }

        .upload-box .label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 8px;
            opacity: 0.5;
            pointer-events: none;
        }

        .remove-img {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            z-index: 20;
            border: none;
            line-height: 1;
            transition: transform .2s;
        }

        .remove-img:hover {
            transform: scale(1.1);
        }

        .submit-btn {
            background: var(--ink);
            color: var(--cream);
            border: none;
            padding: 18px;
            width: 100%;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 2px;
            margin-top: 24px;
            transition: opacity .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .flash {
            padding: 16px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 24px;
            display: none;
            align-items: center;
            gap: 12px;
        }

        .flash.ok {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
            display: flex;
        }

        .flash.err {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
            display: flex;
        }

        .spin {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="admin-container">
        <h2>Nayasha Product Intake</h2>
        <div class="sub-head">Catalogue Management</div>

        <div id="flash" class="flash"></div>

        <form id="productForm">
            <div class="fg">
                <label>Product Name *</label>
                <input type="text" id="title" placeholder="e.g. Royal Banarasi Silk Saree" required>
            </div>

            <div class="frow">
                <div class="fg">
                    <label>Category *</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option>Saree</option>
                        <option>Ready to Wear Saree</option>
                        <option>Lehnga</option>
                        <option>Kurtis</option>
                        <option>Gown</option>
                        <option>Sherwani</option>
                        <option>Coat-Pant</option>
                        <option>Suit pieces</option>
                        <option>Crop tops</option>
                        <option>Indo-Western</option>
                    </select>
                </div>
                <div class="fg">
                    <label>Brand</label>
                    <input type="text" id="brand" value="Nayasha">
                </div>
            </div>

            <div class="frow">
                <div class="fg">
                    <label>Selling Price (₹) *</label>
                    <input type="number" id="price" placeholder="2999" required min="1">
                </div>
                <div class="fg">
                    <label>MRP (Original Price)</label>
                    <input type="number" id="mrp" placeholder="3999">
                </div>
            </div>

            <div class="fg" style="max-width: 200px;">
                <label>Quantity in Stock *</label>
                <input type="number" id="qty" placeholder="Enter 10" required min="0">
            </div>

            <div class="fg">
                <label>Description</label>
                <textarea id="desc" placeholder="Details about fabric, work, occasion, and care..."></textarea>
            </div>

            <div class="fg">
                <label>Product Images (Up to 4)</label>
                <div class="image-grid">
                    <div class="upload-box" id="box1">
                        <input type="file" id="file1" accept="image/*" onchange="handlePreview(this, 'box1')">
                        <button type="button" class="remove-img" onclick="removeImage(event, 'box1')">&times;</button>
                        <div class="icon">📁</div>
                        <div class="label">Main Image</div>
                        <img id="img1">
                    </div>
                    <div class="upload-box" id="box2">
                        <input type="file" id="file2" accept="image/*" onchange="handlePreview(this, 'box2')">
                        <button type="button" class="remove-img" onclick="removeImage(event, 'box2')">&times;</button>
                        <div class="icon">📁</div>
                        <div class="label">Image 2</div>
                        <img id="img2">
                    </div>
                    <div class="upload-box" id="box3">
                        <input type="file" id="file3" accept="image/*" onchange="handlePreview(this, 'box3')">
                        <button type="button" class="remove-img" onclick="removeImage(event, 'box3')">&times;</button>
                        <div class="icon">📁</div>
                        <div class="label">Image 3</div>
                        <img id="img3">
                    </div>
                    <div class="upload-box" id="box4">
                        <input type="file" id="file4" accept="image/*" onchange="handlePreview(this, 'box4')">
                        <button type="button" class="remove-img" onclick="removeImage(event, 'box4')">&times;</button>
                        <div class="icon">📁</div>
                        <div class="label">Image 4</div>
                        <img id="img4">
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span>Upload Product</span>
            </button>
        </form>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbx0_jPu9CquI0G1XM5-BEs4LP6VWiFvt_LlEuzoAFMyEbM3gaYq8Vbz8NuKci-0AtWp/exec';

        async function api(action, data = {}) {
            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action, data })
            });
            return res.json();
        }

        const images = [null, null, null, null];

        function handlePreview(input, boxId) {
            const box = document.getElementById(boxId);
            const img = box.querySelector('img');
            const icon = box.querySelector('.icon');
            const label = box.querySelector('.label');
            const removeBtn = box.querySelector('.remove-img');
            const index = parseInt(boxId.replace('box', '')) - 1;

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    img.src = e.target.result;
                    img.style.display = 'block';
                    icon.style.display = 'none';
                    label.style.display = 'none';
                    removeBtn.style.display = 'flex';
                    images[index] = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removeImage(event, boxId) {
            event.stopPropagation();
            event.preventDefault();
            const box = document.getElementById(boxId);
            const img = box.querySelector('img');
            const icon = box.querySelector('.icon');
            const label = box.querySelector('.label');
            const removeBtn = box.querySelector('.remove-img');
            const input = box.querySelector('input');
            const index = parseInt(boxId.replace('box', '')) - 1;

            img.src = '';
            img.style.display = 'none';
            icon.style.display = 'block';
            label.style.display = 'block';
            removeBtn.style.display = 'none';
            input.value = '';
            images[index] = null;
        }

        function showFlash(msg, isOk) {
            const flash = document.getElementById('flash');
            flash.textContent = msg;
            flash.className = 'flash ' + (isOk ? 'ok' : 'err');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('productForm').onsubmit = async function (e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spin"></div> <span>Uploading to Database...</span>';

            const formData = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                brand: document.getElementById('brand').value,
                price: document.getElementById('price').value,
                mrp: document.getElementById('mrp').value,
                qty: document.getElementById('qty').value,
                desc: document.getElementById('desc').value,
                image1: images[0],
                image2: images[1],
                image3: images[2],
                image4: images[3]
            };

            if (!formData.image1) {
                showFlash('At least the main image is required.', false);
                btn.disabled = false;
                btn.innerHTML = '<span>Upload Product</span>';
                return;
            }

            try {
                const res = await api('addProduct', formData);
                if (res.success) {
                    showFlash('✓ ' + res.message, true);
                    document.getElementById('productForm').reset();
                    // Reset previews
                    document.querySelectorAll('.upload-box img').forEach(i => i.style.display = 'none');
                    document.querySelectorAll('.upload-box .icon, .upload-box .label').forEach(el => el.style.display = 'block');
                    images.fill(null);
                } else {
                    showFlash('Error: ' + res.message, false);
                }
            } catch (err) {
                showFlash('Connection Error: ' + err.toString(), false);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Upload Product</span>';
            }
        };
    </script>
</body>

</html>
